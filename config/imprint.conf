CONFIG_ZMK_RGB_UNDERGLOW=y
# Turn the underglow off when the keyboard goes idle (saves battery)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# PMW3610 sensor tuning
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8

# Input processing
CONFIG_INPUT_QUEUE_MAX_MSGS=32
CONFIG_INPUT_THREAD_STACK_SIZE=768
